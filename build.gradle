plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '2.0.0'
group = 'com.enderabdullah.structuremover'

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = 'structuremover'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

neoForge {
    version = '21.1.249'

    runs {
        client { client() }
        server { server() }
    }

    mods {
        structuremover {
            sourceSet sourceSets.main
        }
    }
}
